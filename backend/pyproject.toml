[project]
name = "ragelit-api"
version = "0.1.0"
description = "RAGelit API"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi[standard]>=0.115,<1",
    "pydantic-settings>=2.7,<3",
    "psycopg[binary]>=3.2,<4",
    "pwdlib[argon2]>=0.2,<1",
    "pyjwt>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "pypdf>=6.19,<7",
    "qdrant-client>=1.15,<1.16",
    "fastembed>=0.8.1,<0.9",
    "httpx2>=2.13.1,<3",
]

[dependency-groups]
dev = [
    "mypy>=1.14,<2",
    "pytest>=9.0.3,<10",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
constraint-dependencies = ["pillow>=12.3,<13"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
