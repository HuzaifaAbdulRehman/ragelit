name: ragelit

services:
  postgres:
    image: ragelit-postgres:18.6-zlib-1.3.2-r1
    build: ./infra/postgres-zlib
    platform: linux/amd64
    pull_policy: build
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ragelit}
      POSTGRES_USER: ${POSTGRES_OWNER_USER:-ragelit_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-ragelit_owner}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-ragelit_app}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./backend/app/alembic/001-create-app-role.sh:/docker-entrypoint-initdb.d/001-create-app-role.sh:ro

  qdrant:
    image: ragelit-qdrant:v1.19.2-pcre2-10.46-deb13u3
    build: ./infra/qdrant-pcre2
    platform: linux/amd64
    pull_policy: build
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  postgres-data:
  qdrant-data:
