name: ragelit

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ragelit}
      POSTGRES_USER: ${POSTGRES_OWNER_USER:-ragelit_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-ragelit_owner}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-ragelit_app}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./backend/app/alembic/001-create-app-role.sh:/docker-entrypoint-initdb.d/001-create-app-role.sh:ro

  qdrant:
    image: qdrant/qdrant:v1.19.2@sha256:b7b0444c4c351c970b98e90a6f89c2ee4287c65b44e52b4cb503fa5b2aa927ad
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  postgres-data:
  qdrant-data:
