name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RAGELIT_AUDIT_EXPORT_DIRECTORY: ${{ github.workspace }}/data/audit-reports/ci
      RAGELIT_INJECTION_EXPORT_DIRECTORY: ${{ github.workspace }}/data/injection-reports/ci
      RAGELIT_ISOLATION_EXPORT_DIRECTORY: ${{ github.workspace }}/data/isolation-reports/ci
      POSTGRES_DB: postgres
      POSTGRES_OWNER_USER: postgres
      POSTGRES_OWNER_PASSWORD: postgres
      POSTGRES_APP_PASSWORD: postgres
      RAGELIT_POSTGRES_CANDIDATE_IMAGE: ragelit-postgres:18.6-zlib-1.3.2-r1
      RAGELIT_QDRANT_CANDIDATE_IMAGE: ragelit-qdrant:v1.19.2-pcre2-10.46-deb13u3

    steps:
      - uses: actions/checkout@v4
      - name: Authenticate Docker Hub pulls
        id: dockerhub
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$GITHUB_ACTOR" == 'dependabot[bot]' ||
                ( "$GITHUB_EVENT_NAME" != push &&
                  ( "$GITHUB_EVENT_NAME" != pull_request ||
                    "$PR_HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ) ) ]]; then
            printf '%s\n' 'Skip Docker Hub login for untrusted events.'
            exit 0
          fi
          if [[ -z "$DOCKERHUB_USERNAME" && -z "$DOCKERHUB_TOKEN" ]]; then
            printf '%s\n' 'Docker Hub secrets are absent; use anonymous pulls.'
            exit 0
          fi
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            printf '%s\n' 'Configure both Docker Hub repository secrets.' >&2
            exit 1
          fi
          printf '%s' "$DOCKERHUB_TOKEN" |
            docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          printf '%s\n' 'authenticated=true' >> "$GITHUB_OUTPUT"
      - name: Build patched service images
        run: docker compose --env-file .env.example --project-name ragelit-ci build postgres qdrant
      - name: Remove Docker Hub credentials
        id: dockerhub_logout
        if: ${{ always() && steps.dockerhub.outputs.authenticated == 'true' }}
        run: docker logout
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start disposable test services
        id: services
        run: docker compose --env-file .env.example --project-name ragelit-ci up -d --no-build --pull never --wait --wait-timeout 60 postgres qdrant
      - name: Verify
        run: bash scripts/verify.sh
      - name: Upload validated audit reports
        uses: actions/upload-artifact@v4
        with:
          name: access-control-audits
          path: data/audit-reports/ci/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload validated injection reports
        uses: actions/upload-artifact@v4
        with:
          name: injection-audits
          path: data/injection-reports/ci/*.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload validated isolation comparisons
        uses: actions/upload-artifact@v4
        with:
          name: isolation-comparisons
          path: data/isolation-reports/ci/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove disposable test services
        if: ${{ always() && steps.services.outcome != 'skipped' }}
        run: docker compose --env-file .env.example --project-name ragelit-ci down --volumes

  security:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
      - name: Install pinned dependency scanner
        env:
          OSV_VERSION: v2.6.0
        run: |
          curl --fail --location --retry 3 --max-time 180 \
            "https://github.com/google/osv-scanner/releases/download/$OSV_VERSION/osv-scanner_linux_amd64" \
            --output "$RUNNER_TEMP/osv-scanner"
          printf '%s  %s\n' \
            'ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108' \
            "$RUNNER_TEMP/osv-scanner" | sha256sum --check
          chmod +x "$RUNNER_TEMP/osv-scanner"
      - name: Verify dependency audit behavior
        env:
          OSV_SCANNER: ${{ runner.temp }}/osv-scanner
        run: python3 -m unittest discover -s scripts/tests -p '*_test.py'
      - name: Download public vulnerability databases
        run: |
          for ecosystem in PyPI npm; do
            mkdir -p "$RUNNER_TEMP/osv-db/osv-scalibr/$ecosystem"
            curl --fail --location --retry 3 --max-time 180 \
              "https://osv-vulnerabilities.storage.googleapis.com/$ecosystem/all.zip" \
              --output "$RUNNER_TEMP/osv-db/osv-scalibr/$ecosystem/all.zip"
          done
      - name: Audit locked dependencies offline
        env:
          OSV_SCANNER: ${{ runner.temp }}/osv-scanner
          OSV_SCANNER_LOCAL_DB_CACHE_DIRECTORY: ${{ runner.temp }}/osv-db
        run: python3 scripts/audit_dependencies.py
