name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RAGELIT_AUDIT_EXPORT_DIRECTORY: ${{ github.workspace }}/data/audit-reports/ci
      RAGELIT_INJECTION_EXPORT_DIRECTORY: ${{ github.workspace }}/data/injection-reports/ci
      RAGELIT_ISOLATION_EXPORT_DIRECTORY: ${{ github.workspace }}/data/isolation-reports/ci
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      qdrant:
        image: qdrant/qdrant:v1.19.2@sha256:b7b0444c4c351c970b98e90a6f89c2ee4287c65b44e52b4cb503fa5b2aa927ad
        ports:
          - 6333:6333

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify
        run: bash scripts/verify.sh
      - name: Upload validated audit reports
        uses: actions/upload-artifact@v4
        with:
          name: access-control-audits
          path: data/audit-reports/ci/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload validated injection reports
        uses: actions/upload-artifact@v4
        with:
          name: injection-audits
          path: data/injection-reports/ci/*.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload validated isolation comparisons
        uses: actions/upload-artifact@v4
        with:
          name: isolation-comparisons
          path: data/isolation-reports/ci/*.json
          if-no-files-found: error
          retention-days: 7

  security:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
      - name: Install pinned dependency scanner
        env:
          OSV_VERSION: v2.6.0
        run: |
          curl --fail --location --retry 3 --max-time 180 \
            "https://github.com/google/osv-scanner/releases/download/$OSV_VERSION/osv-scanner_linux_amd64" \
            --output "$RUNNER_TEMP/osv-scanner"
          printf '%s  %s\n' \
            'ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108' \
            "$RUNNER_TEMP/osv-scanner" | sha256sum --check
          chmod +x "$RUNNER_TEMP/osv-scanner"
      - name: Verify dependency audit behavior
        env:
          OSV_SCANNER: ${{ runner.temp }}/osv-scanner
        run: python3 -m unittest discover -s scripts/tests -p '*_test.py'
      - name: Download public vulnerability databases
        run: |
          for ecosystem in PyPI npm; do
            mkdir -p "$RUNNER_TEMP/osv-db/osv-scalibr/$ecosystem"
            curl --fail --location --retry 3 --max-time 180 \
              "https://osv-vulnerabilities.storage.googleapis.com/$ecosystem/all.zip" \
              --output "$RUNNER_TEMP/osv-db/osv-scalibr/$ecosystem/all.zip"
          done
      - name: Audit locked dependencies offline
        env:
          OSV_SCANNER: ${{ runner.temp }}/osv-scanner
          OSV_SCANNER_LOCAL_DB_CACHE_DIRECTORY: ${{ runner.temp }}/osv-db
        run: python3 scripts/audit_dependencies.py
